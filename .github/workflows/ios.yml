name: iOS build and tests

# Только push: при открытом PR pull_request запускал бы второй прогон на тот же коммит,
# а macOS-минуты в приватном репо идут x10.
on:
  push:
    paths-ignore: ["**.md"]
  workflow_dispatch:

permissions:
  contents: write  # публикация релиза с Salvio.ipa

jobs:
  build-test:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode 26
        # AppMetrica 6.x собирается только в Xcode 26, и App Store с апреля 2026 принимает сборки на iOS 26 SDK.
        # По умолчанию на macos-15 стоит 16.4, берём самый свежий 26.x из образа.
        run: |
          ls -d /Applications/Xcode_*.app
          sudo xcode-select -s "$(ls -d /Applications/Xcode_26*.app | grep -vi beta | sort -V | tail -1)"

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate project
        run: xcodegen generate

      - name: Pick simulator
        # Имена симуляторов меняются от образа к образу, берём первый доступный iPhone.
        run: |
          UDID=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; d=json.load(sys.stdin)["devices"]; print(next(x["udid"] for k,v in d.items() if "iOS" in k for x in v if x["name"].startswith("iPhone")))')
          echo "SIM_UDID=$UDID" >> "$GITHUB_ENV"
          xcodebuild -version

      - name: Build and test (simulator, no signing)
        run: |
          set -o pipefail
          xcodebuild test \
            -project Salvio.xcodeproj \
            -scheme Salvio \
            -destination "id=$SIM_UDID" \
            -resultBundlePath TestResults.xcresult \
            CODE_SIGNING_ALLOWED=NO \
            | tee xcodebuild.log | grep -E "error:|warning: .*(Salvio/|SalvioTests/)|Test Case .*(passed|failed)|\*\* (TEST|BUILD) (SUCCEEDED|FAILED)"

      - name: Build simulator app for Appetize
        # Release под симулятор для arm64 и x86_64: Appetize запускает его в браузере без Mac.
        run: |
          set -o pipefail
          xcodebuild build -project Salvio.xcodeproj -scheme Salvio -configuration Release             -sdk iphonesimulator -derivedDataPath build             ONLY_ACTIVE_ARCH=NO ARCHS="arm64 x86_64" CODE_SIGNING_ALLOWED=NO             | grep -E "error:|\*\* BUILD (SUCCEEDED|FAILED)"
          cd build/Build/Products/Release-iphonesimulator
          ditto -c -k --sequesterRsrc --keepParent Salvio.app "$GITHUB_WORKSPACE/Salvio-simulator.zip"

      - name: Upload simulator app
        uses: actions/upload-artifact@v4
        with:
          name: Salvio-simulator
          path: Salvio-simulator.zip
          retention-days: 14

      - name: Build unsigned iPhone app for Sideloadly
        # Неподписанный .ipa: Sideloadly на Windows подписывает его Apple ID и ставит на iPhone по кабелю.
        run: |
          set -o pipefail
          xcodebuild build -project Salvio.xcodeproj -scheme Salvio -configuration Release             -sdk iphoneos -derivedDataPath build-device             CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY=""             | grep -E "error:|\*\* BUILD (SUCCEEDED|FAILED)"
          mkdir -p Payload
          cp -R build-device/Build/Products/Release-iphoneos/Salvio.app Payload/
          zip -qry Salvio.ipa Payload

      - name: Upload iPhone app
        uses: actions/upload-artifact@v4
        with:
          name: Salvio-iphone
          path: Salvio.ipa
          retention-days: 14

      - name: Pack Xcode project for Mac
        # Исходники вместе с готовым Salvio.xcodeproj: на Mac достаточно Xcode,
        # ни Homebrew, ни XcodeGen, ни git ставить не нужно.
        run: |
          name="$(basename "$GITHUB_WORKSPACE")"
          cd ..
          zip -qry "$GITHUB_WORKSPACE/Salvio-xcode.zip" "$name" \
            -x "$name/.git/*" "$name/build/*" "$name/build-device/*" "$name/Payload/*" \
               "$name/TestResults.xcresult/*" "$name/xcodebuild.log" "$name/*.zip" "$name/*.ipa"

      - name: Upload Xcode project
        uses: actions/upload-artifact@v4
        with:
          name: Salvio-xcode
          path: Salvio-xcode.zip
          retention-days: 14

      - name: Publish release
        # Сборка основной ветки уходит в релиз, и постоянная ссылка
        # https://github.com/Andrey7sh/app_salvio_ios/releases/latest/download/Salvio.ipa
        # всегда отдаёт последнюю версию. ponytail: ветка захардкожена, при переезде iOS в main поменять тут.
        if: github.ref == 'refs/heads/feat/ios-recording-ux'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(grep -m1 'MARKETING_VERSION:' project.yml | sed 's/.*"\(.*\)".*/\1/')
          NOTES=$(printf '%s\n\n%s\n\n%s\n\n%s' \
            "Тестовая сборка для проверки на iPhone, собрана автоматически из коммита ${GITHUB_SHA::7}. Не для App Store." \
            "**Salvio.ipa**: неподписанная сборка для Windows, ставится через Sideloadly, подпись вашим Apple ID. Прямая ссылка на последнюю версию: https://github.com/${GITHUB_REPOSITORY}/releases/latest/download/Salvio.ipa" \
            "**Salvio-xcode.zip**: проект для Mac, инструкция в УСТАНОВКА_НА_IPHONE.md." \
            "Приложение, установленное бесплатным Apple ID, работает 7 дней, потом ставится заново.")
          gh release create "v${VERSION}-b${GITHUB_RUN_NUMBER}" Salvio.ipa Salvio-xcode.zip \
            --target "$GITHUB_SHA" --latest \
            --title "Salvio iOS ${VERSION}, сборка ${GITHUB_RUN_NUMBER}" --notes "$NOTES"

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-logs
          path: |
            xcodebuild.log
            TestResults.xcresult
          if-no-files-found: ignore
